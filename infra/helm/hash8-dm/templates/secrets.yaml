{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
# PLACEHOLDER secret for bootstrapping only. In production set secrets.existingSecret
# and manage the Secret with External Secrets Operator / Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hash8-dm.secretName" . }}
  labels:
    {{- include "hash8-dm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
